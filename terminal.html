<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32-S3 terminal</title>
<style>
  :root {
    --bg: #1b2230;
    --panel: #232c3d;
    --text: #e4e8f0;
    --muted: #8a95ab;
    --accent: #f2b84b;
    --err: #ff8a80;
    --ok: #7fd1ae;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    margin: 0 auto;
    padding: 12px;
    gap: 10px;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1 1 auto; min-width: 0; white-space: nowrap; }
  #status { color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.on { color: var(--ok); }
  .actions { display: flex; gap: 8px; }
  /* Narrow screens (phones): title and status on the first line, the three buttons share the second line,
     so the header is never wider than the screen and the browser does not zoom out to fit it. */
  @media (max-width: 600px) {
    .actions { flex: 1 1 100%; }
    .actions button { flex: 1 1 0; padding: 8px 6px; }
  }
  button {
    background: var(--accent);
    color: #1b2230;
    border: 0;
    border-radius: 6px;
    padding: 8px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: var(--panel); color: var(--text); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #out {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 8px;
    padding: 12px;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .sys { color: var(--muted); }
  .error { color: var(--err); }
  .ok { color: var(--ok); }
  .sent { color: var(--accent); }
  form { display: flex; gap: 8px; }
  /* previous / next command buttons: only on touch screens and narrow windows, where there is no arrow key */
  .hist { display: none; padding: 8px 12px; }
  @media (pointer: coarse), (max-width: 600px) { .hist { display: inline-block; } }
  input {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    color: var(--text);
    border: 1px solid #36425a;
    border-radius: 6px;
    padding: 10px 12px;
    font: inherit;
  }
</style>
</head>
<body>
  <header>
    <h1>ESP32-S3 terminal</h1>
    <span id="status">Disconnected</span>
    <div class="actions">
      <button id="connect">Connect</button>
      <button id="connectAll" class="secondary" title="List every Bluetooth LE device nearby (for troubleshooting)">All devices</button>
      <button id="clear" class="secondary">Clear</button>
    </div>
  </header>

  <pre id="out" aria-live="polite"></pre>

  <form id="form" autocomplete="off">
    <input id="cmd" placeholder="Type a command, e.g. help" disabled>
    <button type="button" id="histUp" class="secondary hist" aria-label="Previous command" disabled>&#9650;</button>
    <button type="button" id="histDown" class="secondary hist" aria-label="Next command" disabled>&#9660;</button>
    <button id="send" disabled>Send</button>
  </form>

<script>
const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // we write here
const NUS_TX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // we get notifications here

const $ = id => document.getElementById(id);
const out = $('out'), cmd = $('cmd'), statusEl = $('status');
const connectBtn = $('connect'), sendBtn = $('send');

let device = null, rxChar = null, txChar = null;
let lastDisconnectAt = 0;   // when the last BLE session ended (used to pace reconnects)
const decoder = new TextDecoder();
const encoder = new TextEncoder();
const history = [];
let histPos = 0;

function ensureNewline() {
  const last = out.lastChild;
  if (last && !last.textContent.endsWith('\n')) {
    const nl = document.createElement('span');
    nl.textContent = '\n';
    out.appendChild(nl);
  }
}

function log(text, cls) {
  if (text && cls && cls !== 'sent') ensureNewline();   // device prompts ("> ") must not glue to our messages
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
  return span;
}

function setConnected(on) {
  statusEl.textContent = on ? 'Connected' : 'Disconnected';
  statusEl.className = on ? 'on' : '';
  connectBtn.textContent = on ? 'Disconnect' : 'Connect';
  cmd.disabled = sendBtn.disabled = !on;
  $('histUp').disabled = $('histDown').disabled = !on;
  $('connectAll').disabled = on;
  if (on) cmd.focus();
}

// ---- framed binary transfers from the ESP32 ----
// Frame: "@BEGIN <size> <total> <name>\r\n" + <size> raw bytes + "\r\n@END <crc32 hex>\r\n"   |   "@ERR <message>\r\n"
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

let pending = null;   // the one transfer in flight, if any
const TRANSFER_IDLE_MS = 15000;

function armTimeout() {
  clearTimeout(pending.timer);
  pending.timer = setTimeout(() => finishPending(new Error('device stopped responding')), pending.idleMs);
}

function finishPending(err, result) {
  if (!pending) return;
  const p = pending;
  pending = null;
  clearTimeout(p.timer);
  if (err) {
    err.got = p.got;      // how far the transfer got, for the summary
    err.size = p.size;
    p.reject(err);
  } else {
    p.resolve(result);
  }
}

// Send a command and collect the framed reply (nothing from it is shown in the terminal).
// command: a text line, or a Uint8Array of raw payload bytes.
// handlers: { onBegin(size, total, name), onProgress(receivedBytes, size), idleMs, accept(okText) }
function request(command, handlers = {}) {
  return new Promise((resolve, reject) => {
    if (pending) return reject(new Error('another transfer is in progress'));
    pending = { resolve, reject, onBegin: handlers.onBegin, onProgress: handlers.onProgress,
                idleMs: handlers.idleMs || TRANSFER_IDLE_MS, accept: handlers.accept,
                state: 'header', head: '', tail: '', size: 0, total: 0, name: '', body: null, got: 0, timer: null };
    armTimeout();
    (typeof command === 'string' ? write(command + '\n') : writeBytes(command)).catch(e => finishPending(e));
  });
}

function feed(bytes) {
  const p = pending;
  let i = 0;
  armTimeout();
  while (i < bytes.length && pending === p) {
    if (p.state === 'header') {
      const b = bytes[i++];
      p.head += String.fromCharCode(b);
      if (b === 10) {
        const err = /@ERR (.*)/.exec(p.head);
        const begin = /@BEGIN (\d+) (\d+) (.*)/.exec(p.head);
        const okm = /@OK (.*)/.exec(p.head);
        if (err) {
          const de = new Error(err[1].trim() || 'device error');
          de.fatal = !/^crc mismatch/i.test(de.message);   // a refusal: retrying will not help (a bad CRC can be retried)
          finishPending(de);
        } else if (begin) {
          p.size = parseInt(begin[1], 10);
          p.total = parseInt(begin[2], 10);
          p.name = begin[3].trim();
          p.body = new Uint8Array(p.size);
          p.state = p.size ? 'body' : 'tail';
          if (p.onBegin) p.onBegin(p.size, p.total, p.name);
        } else if (okm) {
          const text = okm[1].trim();
          if (!p.accept || p.accept(text)) finishPending(null, { ok: text });
          else p.head = '';      // a stale reply from an earlier attempt: keep waiting
        } else {
          p.head = '';   // stray text such as a late prompt or the time reply
        }
      }
    } else if (p.state === 'body') {
      const n = Math.min(bytes.length - i, p.size - p.got);
      p.body.set(bytes.subarray(i, i + n), p.got);
      p.got += n;
      i += n;
      if (p.onProgress) p.onProgress(p.got, p.size);
      if (p.got === p.size) p.state = 'tail';
    } else {
      const b = bytes[i++];
      p.tail += String.fromCharCode(b);
      if (b === 10 && p.tail.includes('@END')) {
        const m = /@END ([0-9a-f]{8})/.exec(p.tail);
        const got = crc32(p.body).toString(16).padStart(8, '0');
        if (!m || m[1] !== got) finishPending(new Error('checksum mismatch, transfer corrupted'));
        else finishPending(null, { name: p.name, data: p.body, total: p.total });
      }
    }
  }
  if (i < bytes.length) showDeviceText(bytes.subarray(i));  // e.g. the next prompt
}

let swallowPrompts = false;   // true while a pcloud run is active
function showDeviceText(bytes) {
  const t = decoder.decode(bytes, { stream: true });
  if (swallowPrompts && /^\s*>\s*$/.test(t)) return;
  log(t);
}

function onData(event) {
  const dv = event.target.value;
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  if (pending) feed(bytes);
  else showDeviceText(bytes);
}

// ---- progress, summary and the pcloud command ----
const fmt = n => Math.round(n).toLocaleString();
const secs = ms => (ms / 1000).toFixed(1) + ' s';
const rate = (bytes, ms) => ms > 0 ? ', ' + (bytes / 1024 / (ms / 1000)).toFixed(1) + ' KB/s' : '';

// One line in the terminal that is updated in place (at most ~10 times per second)
function makeProgress(label) {
  ensureNewline();
  const el = log('', 'sys');
  let last = 0;
  return {
    update(done, total, force) {
      const now = performance.now();
      if (!force && now - last < 100) return;
      last = now;
      const pct = total ? Math.floor(done * 100 / total) : 100;
      el.textContent = (total
        ? label + ': ' + fmt(done) + ' of ' + fmt(total) + ' bytes (' + pct + '%)'
        : label + ': ' + fmt(done) + ' bytes') + '\n';
      out.scrollTop = out.scrollHeight;
    },
    finish(text, cls) {
      el.textContent = text + '\n';
      if (cls) el.className = cls;
      out.scrollTop = out.scrollHeight;
    }
  };
}

// fetch() cannot report upload progress, XMLHttpRequest can
function postWithProgress(url, form, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.timeout = 10 * 60 * 1000;
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded, e.total); };
    xhr.onload = () => resolve({ status: xhr.status, text: xhr.responseText });
    xhr.onerror = () => reject(new Error('could not reach the server (offline, blocked, or CORS; see the browser console)'));
    xhr.ontimeout = () => reject(new Error('upload timed out'));
    xhr.onabort = () => reject(new Error('upload cancelled'));
    xhr.send(form);
  });
}

const retryText = n => n ? ', ' + n + ' chunk ' + (n === 1 ? 'retry' : 'retries') : '';
const STEP_LABEL = { token: 'fetching the token', receive: 'the BLE file transfer', upload: 'the pCloud upload' };

function printSummary(ok, s, err, folderId) {
  const L = [ok ? 'Summary: SUCCESS' : 'Summary: FAILED during ' + STEP_LABEL[s.step]];
  L.push('  File:    ' + s.file);
  if (s.step === 'receive') {
    L.push('  BLE:     ' + (s.received || s.size
      ? fmt(s.received) + (s.size ? ' of ' + fmt(s.size) : '') + ' bytes received before the failure' + retryText(s.retries)
      : 'no data received'));
  } else if (s.step === 'upload') {
    L.push('  BLE:     ' + fmt(s.size) + ' bytes received, checksums OK, ' + secs(s.recvMs) + rate(s.size, s.recvMs) + retryText(s.retries));
    L.push('  pCloud:  ' + (ok
      ? fmt(s.size) + ' bytes uploaded to folder ' + folderId + ', ' + secs(s.upMs) + rate(s.size, s.upMs)
      : s.uploaded >= s.size
        ? 'all ' + fmt(s.size) + ' bytes sent, but the upload was not accepted'
        : fmt(s.uploaded) + ' of ' + fmt(s.size) + ' bytes sent before the failure'));
  }
  if (!ok) L.push('  Reason:  ' + err.message);
  log(L.join('\n') + '\n', ok ? 'ok' : 'error');
}

// ---- file download in checksummed chunks, with retries ----
const CHUNK_BYTES = 1024;    // every chunk is its own request with its own CRC-32
const CHUNK_IDLE_MS = 5000;  // give up on a chunk if nothing arrives for this long
const CHUNK_RETRIES = 3;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchFile(path, handlers = {}) {
  let total = -1, offset = 0, name = path.split('/').pop(), data = null, retries = 0;
  try {
    while (total < 0 || offset < total) {
      for (let attempt = 0; ; attempt++) {
        try {
          const r = await request('get ' + path + ' ' + offset + ' ' + CHUNK_BYTES, {
            idleMs: CHUNK_IDLE_MS,
            onBegin: (len, tot, nm) => {
              if (total < 0) {
                total = tot;
                name = nm;
                data = new Uint8Array(tot);
                if (handlers.onBegin) handlers.onBegin(tot, nm);
              }
            },
            onProgress: got => { if (handlers.onProgress) handlers.onProgress(offset + got, total); }
          });
          if (r.data.length === 0 && offset < r.total) {
            const empty = new Error('device returned no data');
            empty.fatal = true;
            throw empty;
          }
          data.set(r.data, offset);
          offset += r.data.length;
          break;
        } catch (e) {
          if (e.fatal || attempt >= CHUNK_RETRIES) throw e;
          retries++;
          await sleep(400);   // let anything still in flight from the failed attempt drain
        }
      }
    }
  } catch (e) {
    e.got = offset;                      // file-level numbers for the summary
    e.size = total > 0 ? total : 0;
    e.retries = retries;
    throw e;
  }
  return { name, data, retries };
}

// ---- encrypted pCloud token ----
// The token is never stored or sent in clear. "pcloud settoken" encrypts it in this page (AES-256-GCM, key from
// a passphrase via PBKDF2, both built into the browser) and stores only the encrypted blob on the device as
// /token.enc. The ESP32 just stores and forwards the blob and can never read the token. The passphrase is typed
// here and never leaves this page.
const TOKEN_FILE = '/token.enc';
const PBKDF2_ITER = 200000;
let credCache = null;        // decrypted { token, apiHost }, kept in memory until the connection closes

const b64 = bytes => btoa(String.fromCharCode(...bytes));
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

function askText(title, opts = {}) {      // small dialog; resolves with the text, or null if cancelled
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;' +
                            'justify-content:center;z-index:1000;padding:16px';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;color:#222;border-radius:10px;padding:16px;max-width:420px;width:100%;' +
                        'box-shadow:0 8px 24px rgba(0,0,0,.4);font-family:system-ui,sans-serif';
    const h = document.createElement('div');
    h.textContent = title;
    h.style.cssText = 'font-weight:600;margin-bottom:10px';
    const inp = document.createElement('input');
    inp.type = opts.secret ? 'password' : 'text';
    inp.value = opts.value || '';
    inp.autocomplete = 'off';
    inp.style.cssText = 'width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #999;border-radius:6px';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;margin-top:12px';
    const mk = (label, primary) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'padding:8px 16px;font-size:15px;border:0;border-radius:6px;cursor:pointer;' +
                        (primary ? 'background:#0062C6;color:#fff' : 'background:#ddd;color:#222');
      return b;
    };
    const cancel = mk('Cancel', false), ok = mk('OK', true);
    const done = v => { overlay.remove(); resolve(v); };
    cancel.onclick = () => done(null);
    ok.onclick = () => done(inp.value);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') done(inp.value);
      if (e.key === 'Escape') done(null);
    });
    row.append(cancel, ok);
    box.append(h, inp, row);
    overlay.append(box);
    document.body.append(overlay);
    inp.focus();
  });
}

function needCrypto() {
  if (!window.crypto || !crypto.subtle) {
    throw new Error('this browser feature needs a secure page (https:// or localhost)');
  }
}

async function deriveTokenKey(pass, salt, iter) {
  needCrypto();
  if (!(iter >= 10000 && iter <= 2000000)) throw new Error('unsupported key derivation settings');
  const base = await crypto.subtle.importKey('raw', encoder.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base,
                                 { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function encryptToken(plain, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveTokenKey(pass, salt, PBKDF2_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoder.encode(plain)));
  return JSON.stringify({ v: 1, kdf: 'PBKDF2-SHA256', iter: PBKDF2_ITER, salt: b64(salt), iv: b64(iv), ct: b64(ct) });
}

async function decryptToken(meta, pass) {
  const key = await deriveTokenKey(pass, unb64(meta.salt), meta.iter);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(meta.iv) }, key, unb64(meta.ct));
  return decoder.decode(plain);
}

// Token and API host for the pCloud commands: asks the device for the stored data and decrypts it here.
async function getPcloudCredentials() {
  if (credCache) return credCache;
  const reply = await request('token');
  const text = new TextDecoder().decode(reply.data).trim();
  let plain;
  if (text.startsWith('{')) {                       // encrypted token file
    let meta;
    try { meta = JSON.parse(text); } catch (e) { throw new Error('the token file on the device is damaged'); }
    if (meta.v !== 1) throw new Error('unknown token file version');
    for (let attempt = 1; ; attempt++) {
      const pass = await askText('Passphrase for the pCloud token', { secret: true });
      if (pass === null) throw new Error('cancelled, no passphrase entered');
      try { plain = await decryptToken(meta, pass); break; }
      catch (e) {
        if (e.message && /secure page|unsupported/.test(e.message)) throw e;
        log('Wrong passphrase.\n', 'error');
        if (attempt >= 3) throw new Error('wrong passphrase');
      }
    }
  } else {                                          // old unencrypted /token.txt
    plain = text;
    log('Warning: this token is stored and sent unencrypted. Run "pcloud settoken" to store it encrypted.\n', 'error');
  }
  const [token, host] = plain.split('\n').map(x => x.trim());
  if (!token) throw new Error('no token found');
  credCache = { token, apiHost: host || 'eapi.pcloud.com' };
  return credCache;
}

// pcloud settoken: encrypt a pCloud token with a passphrase and store it on the device
async function runSetToken() {
  try { needCrypto(); } catch (e) { log(e.message + '\n', 'error'); return; }
  const token = await askText('pCloud access token (hidden)', { secret: true });
  if (!token || !token.trim()) { log('Cancelled.\n', 'sys'); return; }
  const host = await askText('pCloud API host', { value: 'eapi.pcloud.com' });
  if (!host || !host.trim()) { log('Cancelled.\n', 'sys'); return; }
  const pass1 = await askText('Choose a passphrase (at least 12 characters)', { secret: true });
  if (!pass1) { log('Cancelled.\n', 'sys'); return; }
  if (pass1.length < 12) { log('The passphrase is too short: use at least 12 characters (a few random words are fine).\n', 'error'); return; }
  const pass2 = await askText('Repeat the passphrase', { secret: true });
  if (pass1 !== pass2) { log('The passphrases do not match, nothing was stored.\n', 'error'); return; }

  swallowPrompts = true;
  try {
    log('Encrypting the token...\n', 'sys');
    const blob = await encryptToken(token.trim() + '\n' + host.trim(), pass1);
    await putFile(TOKEN_FILE, encoder.encode(blob));
    credCache = null;
    log('Encrypted token stored as ' + TOKEN_FILE + ' on the device. Remember the passphrase: it cannot be recovered.\n', 'sys');
  } catch (e) {
    log('Could not store the token: ' + e.message + '\n', 'error');
  } finally {
    swallowPrompts = false;
  }
}

// ---- pcloud put <directory>: upload all files below a directory, keeping the folder structure ----
const normPath = p => '/' + p.split('/').filter(Boolean).join('/');          // "/a/b"; the root becomes "/"
const dirOf = p => p.slice(0, p.lastIndexOf('/'));                           // "/a/b/c.txt" -> "/a/b"

async function pcloudCall(apiHost, method, params) {
  let res, json;
  try { res = await fetch('https://' + apiHost + '/' + method, { method: 'POST', body: new URLSearchParams(params) }); }
  catch (e) { throw new Error('could not reach the server (offline, blocked, or CORS; see the browser console)'); }
  try { json = await res.json(); }
  catch (e) { throw new Error('unexpected reply from pCloud (HTTP ' + res.status + ')'); }
  if (json.result !== 0) throw new Error('pCloud error ' + json.result + ': ' + (json.error || 'unknown'));
  return json;
}

async function runPcloudPutDir(path, parentFolderId) {
  const base = normPath(path);                         // "/" for the whole file system
  const rootName = base === '/' ? 'LittleFS' : base.slice(base.lastIndexOf('/') + 1);
  const baseKey = base === '/' ? '' : base;            // so that dirOf("/a.txt") === baseKey for the root
  const T = { ok: 0, bytes: 0, failed: [], skipped: [], total: 0, totalBytes: 0 };
  const t0 = performance.now();
  swallowPrompts = true;
  let fatal = null;
  try {
    log('Fetching token from the device...\n', 'sys');
    const { token, apiHost } = await getPcloudCredentials();

    log('Listing files in ' + base + '...\n', 'sys');
    const reply = await request('flist ' + base);
    const files = [];
    for (const line of new TextDecoder().decode(reply.data).split('\n')) {
      if (!line) continue;
      if (line[0] === '!') { T.skipped.push(line.slice(2)); continue; }
      const sp = line.indexOf(' ');
      files.push({ size: parseInt(line.slice(0, sp), 10) || 0, path: line.slice(sp + 1) });
    }
    T.total = files.length;
    T.totalBytes = files.reduce((n, f) => n + f.size, 0);
    if (!files.length) { log('No files to upload in ' + base + '.\n', 'sys'); return; }

    log('Uploading ' + files.length + ' file(s), ' + fmt(T.totalBytes) + ' bytes, from ' + base +
        ' to the pCloud folder "' + rootName + '" (inside folder ' + parentFolderId + ')\n', 'sys');

    // pCloud folder for every device directory, created on demand
    const ids = new Map();
    const folderFor = async dirPath => {
      if (ids.has(dirPath)) return ids.get(dirPath);
      let parentId, name;
      if (dirPath === baseKey) { parentId = parentFolderId; name = rootName; }
      else { parentId = await folderFor(dirOf(dirPath)); name = dirPath.slice(dirPath.lastIndexOf('/') + 1); }
      const r = await pcloudCall(apiHost, 'createfolderifnotexists',
                                 { access_token: token, folderid: String(parentId), name });
      const id = String(r.metadata.folderid);
      ids.set(dirPath, id);
      return id;
    };

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const tag = '[' + (i + 1) + '/' + files.length + '] ';
      const el = log('', 'sys');                       // one line per file, updated in place
      let lastDraw = 0;
      const draw = (text, force) => {
        const now = performance.now();
        if (!force && now - lastDraw < 150) return;
        lastDraw = now;
        el.textContent = tag + f.path + ': ' + text + '\n';
        out.scrollTop = out.scrollHeight;
      };
      try {
        draw('receiving...', true);
        const t1 = performance.now();
        const file = await fetchFile(f.path, {
          onBegin: size => draw('receiving 0 of ' + fmt(size) + ' bytes', true),
          onProgress: (got, size) => draw('receiving ' + fmt(got) + ' of ' + fmt(size) + ' bytes')
        });
        const recvMs = performance.now() - t1;
        const len = file.data.length;

        const folder = await folderFor(dirOf(f.path));
        draw('uploading 0 of ' + fmt(len) + ' bytes', true);
        const form = new FormData();                   // parameters first, then the file, as pCloud requires
        form.append('access_token', token);
        form.append('folderid', folder);
        form.append('nopartial', '1');
        form.append('file', new Blob([file.data]), file.name);
        const t2 = performance.now();
        const res = await postWithProgress('https://' + apiHost + '/uploadfile', form, (loaded, total) =>
          draw('uploading ' + fmt(Math.min(len, Math.round(loaded / total * len))) + ' of ' + fmt(len) + ' bytes'));
        const upMs = performance.now() - t2;
        let json;
        try { json = JSON.parse(res.text); }
        catch (e) { throw new Error('unexpected reply from pCloud (HTTP ' + res.status + ')'); }
        if (json.result !== 0) throw new Error('pCloud error ' + json.result + ': ' + (json.error || 'unknown'));

        T.ok++;
        T.bytes += len;
        draw(fmt(len) + ' bytes uploaded (BLE' + rate(len, recvMs) + '; pCloud' + rate(len, upMs) + ')', true);
      } catch (e) {
        T.failed.push(f.path + ': ' + e.message);
        el.className = 'error';
        draw('FAILED: ' + e.message, true);
        if (!device || !device.gatt.connected) throw new Error('the Bluetooth connection was lost');
      }
    }
  } catch (e) {
    fatal = e;
    log('Directory upload stopped: ' + e.message + '\n', 'error');
  } finally {
    swallowPrompts = false;
  }

  const allOk = !fatal && T.failed.length === 0;
  const L = [allOk ? 'Summary: SUCCESS' : (T.ok ? 'Summary: PARTIAL' : 'Summary: FAILED')];
  L.push('  Folder:  ' + base + ' -> pCloud "' + rootName + '" (inside folder ' + parentFolderId + ')');
  L.push('  Files:   ' + T.ok + ' of ' + T.total + ' uploaded, ' + fmt(T.bytes) + ' of ' + fmt(T.totalBytes) + ' bytes, ' + secs(performance.now() - t0));
  if (T.skipped.length) L.push('  Skipped: ' + T.skipped.length + ' file(s) with a space in the name: ' + T.skipped.join(', '));
  for (const f of T.failed) L.push('  Failed:  ' + f);
  log(L.join('\n') + '\n', allOk ? 'sys' : 'error');
}

// pcloud <file> [folderid]: the browser does the upload, the ESP32 only supplies data
async function runPcloudPut(args) {
  const path = args[0];
  const folderId = args[1] === undefined ? '0' : args[1];
  if (!path || !/^\d+$/.test(folderId)) {
    log('usage: pcloud put <file or directory> [folderid]   (folderid 0 = root)\n' +
        '       pcloud get <path in pCloud> [device file]\n' +
        '       pcloud settoken   (store your pCloud token encrypted on the device)\n' +
        '       upload [device file or directory/]   (choose one or more files on this computer)\n', 'error');
    return;
  }

  // A directory? "get <path> 0 0" answers "is a directory" without sending any data, and works for files too.
  let isDir = false;
  swallowPrompts = true;
  try { await request('get ' + path + ' 0 0'); }
  catch (e) { isDir = /is a directory/i.test(e.message); }
  finally { swallowPrompts = false; }
  if (isDir) return runPcloudPutDir(path, folderId);

  const s = { step: 'token', file: path, size: 0, received: 0, uploaded: 0, recvMs: 0, upMs: 0, retries: 0 };
  let recv = null, up = null;
  swallowPrompts = true;
  try {
    log('Fetching token from the device...\n', 'sys');
    const { token, apiHost } = await getPcloudCredentials();

    s.step = 'receive';
    const t0 = performance.now();
    const file = await fetchFile(path, {
      onBegin: (size, name) => {
        s.size = size;
        s.file = name;
        recv = makeProgress('Receiving ' + name + ' over BLE');
        recv.update(0, size, true);
      },
      onProgress: (got, size) => { s.received = got; if (recv) recv.update(got, size); }
    });
    s.recvMs = performance.now() - t0;
    s.received = file.data.length;
    s.retries = file.retries;
    recv.finish('Received ' + file.name + ': ' + fmt(s.received) + ' bytes over BLE, checksums OK' + (s.retries ? ' (' + s.retries + ' retried)' : ''), 'sys');

    s.step = 'upload';
    up = makeProgress('Uploading ' + file.name + ' to ' + apiHost);
    up.update(0, s.size, true);
    const form = new FormData();      // parameters first, then the file, as pCloud requires
    form.append('access_token', token);
    form.append('folderid', folderId);
    form.append('nopartial', '1');
    form.append('file', new Blob([file.data]), file.name);

    const t1 = performance.now();
    const res = await postWithProgress('https://' + apiHost + '/uploadfile', form, (loaded, total) => {
      s.uploaded = Math.min(s.size, Math.round(loaded / total * s.size));
      up.update(s.uploaded, s.size);
    });
    s.upMs = performance.now() - t1;

    let json;
    try { json = JSON.parse(res.text); }
    catch { throw new Error('unexpected reply from pCloud (HTTP ' + res.status + ')'); }
    if (json.result !== 0) throw new Error('pCloud error ' + json.result + ': ' + (json.error || 'unknown'));

    s.uploaded = s.size;
    up.finish('Uploaded ' + file.name + ': ' + fmt(s.size) + ' bytes to pCloud folder ' + folderId, 'sys');
    printSummary(true, s, null, folderId);
  } catch (e) {
    if (s.step === 'receive' && e.got !== undefined) s.received = e.got;
    if (e.retries !== undefined) s.retries = e.retries;
    if (s.step === 'receive' && e.size) s.size = e.size;
    if (s.step === 'receive' && recv) recv.finish('Receiving ' + s.file + ': stopped at ' + fmt(s.received) + ' of ' + fmt(s.size) + ' bytes', 'error');
    if (s.step === 'upload' && up) {
      up.finish(s.uploaded >= s.size
        ? 'Uploading ' + s.file + ': all ' + fmt(s.size) + ' bytes sent, but the upload was not accepted'
        : 'Uploading ' + s.file + ': stopped at ' + fmt(s.uploaded) + ' of ' + fmt(s.size) + ' bytes', 'error');
    }
    printSummary(false, s, e, folderId);
  } finally {
    swallowPrompts = false;
  }
}

// ---- sending files to the device: "put" in checksummed chunks ----
// Each chunk: text line "put <file> <total> <offset> <len> <crc> <id>", wait for "@OK go <id>",
// then the raw bytes, then wait for "@OK <offset+len>". The bytes are only sent after "go", so the
// device can never mistake file contents for commands.
const PUT_CHUNK = 1024;          // must not exceed RXBIN_MAX in the firmware
const PUT_IDLE_MS = 6000;
const PUT_RETRY_WAIT_MS = 3500;  // longer than the firmware's 3 s payload timeout
let putId = 0;

async function negotiateWriteSize() {
  try {
    const r = await request('mtu', { accept: t => t.startsWith('mtu ') });
    const m = /mtu (\d+)/.exec(r.ok);
    if (m) writeChunk = Math.max(20, Math.min(parseInt(m[1], 10) - 3, 244));
  } catch (e) {
    writeChunk = 20;
  }
}

async function putFile(path, bytes, handlers = {}) {
  const total = bytes.length;
  let offset = 0, retries = 0;
  try {
    await negotiateWriteSize();
    while (offset < total) {
      const len = Math.min(PUT_CHUNK, total - offset);
      const chunk = bytes.subarray(offset, offset + len);
      const crc = crc32(chunk).toString(16).padStart(8, '0');
      for (let attempt = 0; ; attempt++) {
        try {
          const id = ++putId;
          await request('put ' + path + ' ' + total + ' ' + offset + ' ' + len + ' ' + crc + ' ' + id,
                        { idleMs: PUT_IDLE_MS, accept: t => t === 'go ' + id });
          await request(chunk, { idleMs: PUT_IDLE_MS, accept: t => t === String(offset + len) });
          break;
        } catch (e) {
          if (e.fatal || attempt >= CHUNK_RETRIES) throw e;
          retries++;
          // after a timeout the device may still be waiting for payload bytes, so wait it out
          await sleep(/stopped responding/.test(e.message) ? PUT_RETRY_WAIT_MS : 300);
        }
      }
      offset += len;
      if (handlers.onProgress) handlers.onProgress(offset, total);
    }
    await request('commit ' + path + ' ' + total, { idleMs: PUT_IDLE_MS, accept: t => t.startsWith('committed') });
  } catch (e) {
    if (/stopped responding/.test(e.message)) await sleep(PUT_RETRY_WAIT_MS);
    try { await request('abort ' + path, { idleMs: 3000, accept: t => t === 'aborted' }); } catch (ignored) {}  // remove the partial file
    e.got = offset;
    e.size = total;
    e.retries = retries;
    throw e;
  }
  return { retries };
}

// ---- helpers for the pcloud get / upload commands ----
function parseArgs(text) {    // words separated by spaces; "double quotes" keep spaces inside one word
  const out = [];
  const re = /"([^"]*)"|(\S+)/g;
  let m;
  while ((m = re.exec(text)) !== null) out.push(m[1] !== undefined ? m[1] : m[2]);
  return out;
}

function pickFiles() {        // must be called straight from the Enter key press (user gesture)
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;      // one or more files can be chosen
    input.addEventListener('change', () => resolve(Array.from(input.files)));
    input.addEventListener('cancel', () => resolve([]));
    input.click();
  });
}

function downloadWithProgress(url, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url);
    xhr.responseType = 'arraybuffer';
    xhr.timeout = 10 * 60 * 1000;
    xhr.onprogress = e => onProgress(e.loaded, e.lengthComputable ? e.total : 0);
    xhr.onload = () => xhr.status === 200
      ? resolve(new Uint8Array(xhr.response))
      : reject(new Error('download failed (HTTP ' + xhr.status + ')'));
    xhr.onerror = () => reject(new Error('could not download from the pCloud content server (blocked or CORS; see the browser console)'));
    xhr.ontimeout = () => reject(new Error('download timed out'));
    xhr.onabort = () => reject(new Error('download cancelled'));
    xhr.send();
  });
}

// Copies bytes to a file on the device and records the numbers for the summary
async function sendToDevice(local, data, s) {
  s.step = 'send';
  s.size = data.length;
  const prog = makeProgress('Sending ' + local + ' to the device');
  prog.update(0, data.length, true);
  const t0 = performance.now();
  try {
    const r = await putFile(local, data, { onProgress: (done, total) => { s.sent = done; prog.update(done, total); } });
    s.sendMs = performance.now() - t0;
    s.sent = data.length;
    s.retries = r.retries;
    prog.finish('Sent ' + local + ': ' + fmt(data.length) + ' bytes over BLE, checksums OK' +
                (s.retries ? ' (' + s.retries + ' retried)' : ''), 'sys');
  } catch (e) {
    if (e.got !== undefined) s.sent = e.got;
    if (e.retries !== undefined) s.retries = e.retries;
    prog.finish('Sending ' + local + ': stopped at ' + fmt(s.sent) + ' of ' + fmt(data.length) + ' bytes', 'error');
    throw e;
  }
}

const SEND_STEP = { token: 'fetching the token', link: 'getting the download link',
                    download: 'the pCloud download', send: 'the BLE transfer to the device' };

function printSendSummary(ok, s, err) {
  const L = [ok ? 'Summary: SUCCESS' : 'Summary: FAILED during ' + SEND_STEP[s.step]];
  L.push('  File:    ' + s.source + ' -> ' + s.local);
  if (s.fromPcloud && s.step === 'download') {
    L.push('  pCloud:  ' + fmt(s.downloaded) + (s.size ? ' of ' + fmt(s.size) : '') + ' bytes downloaded before the failure');
  } else if (s.fromPcloud && s.step === 'send') {
    L.push('  pCloud:  ' + fmt(s.size) + ' bytes downloaded, ' + secs(s.downMs) + rate(s.size, s.downMs));
  }
  if (s.step === 'send') {
    L.push('  BLE:     ' + (ok
      ? fmt(s.size) + ' bytes sent and committed, checksums OK, ' + secs(s.sendMs) + rate(s.size, s.sendMs)
      : fmt(s.sent) + ' of ' + fmt(s.size) + ' bytes sent before the failure') + retryText(s.retries));
  }
  if (!ok) L.push('  Reason:  ' + err.message);
  log(L.join('\n') + '\n', ok ? 'ok' : 'error');
}

// pcloud get <path in pCloud> [device file]: pCloud -> browser -> BLE -> LittleFS
async function runPcloudGet(args) {
  let remote = args[0];
  if (!remote) {
    log('usage: pcloud get <path in pCloud> [device file]   (quotes around names with spaces)\n', 'error');
    return;
  }
  if (!remote.startsWith('/')) remote = '/' + remote;
  let local = args[1] || '/' + remote.split('/').pop();
  if (!local.startsWith('/')) local = '/' + local;
  if (/\s/.test(local)) {
    log('Device file names cannot contain spaces. Give one as the second argument.\n', 'error');
    return;
  }

  const s = { fromPcloud: true, step: 'token', source: remote, local, size: 0, downloaded: 0,
              downMs: 0, sent: 0, sendMs: 0, retries: 0 };
  let down = null;
  swallowPrompts = true;
  try {
    log('Fetching token from the device...\n', 'sys');
    const { token, apiHost } = await getPcloudCredentials();

    s.step = 'link';
    log('Asking pCloud for a download link...\n', 'sys');
    let info;
    try {
      const res = await fetch('https://' + apiHost + '/getfilelink?' +
                              new URLSearchParams({ path: remote, access_token: token }));
      info = await res.json();
    } catch (e) {
      throw new Error('could not get a download link (' + e.message + '). pCloud documents getfilelink as ' +
                      'not usable from web pages, so the browser may be blocking it. Download the file ' +
                      'manually and use: upload ' + local);
    }
    if (info.result === 7010) {
      throw new Error('pCloud refuses download links for web pages (error 7010, Invalid link referer). ' +
                      'This is a pCloud restriction, not something this page can change. ' +
                      'Download the file with the pCloud website or app instead, then use: upload ' + local);
    }
    if (info.result !== 0) throw new Error('pCloud error ' + info.result + ': ' + (info.error || 'unknown'));
    if (!info.hosts || !info.hosts.length) throw new Error('pCloud returned no download server');

    s.step = 'download';
    down = makeProgress('Downloading ' + remote + ' from pCloud');
    const t0 = performance.now();
    const data = await downloadWithProgress('https://' + info.hosts[0] + info.path, (done, total) => {
      s.downloaded = done;
      if (total) s.size = total;
      down.update(done, total);
    });
    s.downMs = performance.now() - t0;
    s.size = s.downloaded = data.length;
    down.finish('Downloaded ' + remote + ': ' + fmt(data.length) + ' bytes from pCloud', 'sys');

    await sendToDevice(local, data, s);
    printSendSummary(true, s);
  } catch (e) {
    if (s.step === 'download' && down) {
      down.finish('Downloading ' + remote + ': stopped at ' + fmt(s.downloaded) +
                  (s.size ? ' of ' + fmt(s.size) : '') + ' bytes', 'error');
    }
    printSendSummary(false, s, e);
  } finally {
    swallowPrompts = false;
  }
}

// upload [device file]: choose a file on this computer and copy it to the device's LittleFS
// upload [directory/] with several files chosen: every file goes into the directory (created if missing)
async function runUploadMany(files, target) {
  const dir = '/' + target.split('/').filter(Boolean).join('/');      // "/" or "/a/b"
  if (/\s/.test(dir)) { log('Device names cannot contain spaces. Use: upload /directory/\n', 'error'); return; }
  const T = { ok: 0, bytes: 0, failed: [], skipped: [] };
  const totalBytes = files.reduce((n, f) => n + f.size, 0);
  log('Sending ' + files.length + ' file(s), ' + fmt(totalBytes) + ' bytes, to ' + dir + '\n', 'sys');
  const t0 = performance.now();
  let fatal = null;
  swallowPrompts = true;
  try {
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const local = (dir === '/' ? '' : dir) + '/' + f.name;
      const tag = '[' + (i + 1) + '/' + files.length + '] ';
      const el = log('', 'sys');                      // one line per file, updated in place
      let lastDraw = 0;
      const draw = (text, force) => {
        const now = performance.now();
        if (!force && now - lastDraw < 150) return;
        lastDraw = now;
        el.textContent = tag + local + ': ' + text + '\n';
        out.scrollTop = out.scrollHeight;
      };
      if (/\s/.test(f.name)) {
        T.skipped.push(f.name);
        el.className = 'error';
        draw('skipped (device file names cannot contain spaces)', true);
        continue;
      }
      try {
        draw('reading...', true);
        const data = new Uint8Array(await f.arrayBuffer());
        const t1 = performance.now();
        const r = await putFile(local, data, { onProgress: (done, total) => draw('sending ' + fmt(done) + ' of ' + fmt(total) + ' bytes') });
        T.ok++;
        T.bytes += data.length;
        draw(fmt(data.length) + ' bytes sent, checksums OK' + rate(data.length, performance.now() - t1) + retryText(r.retries), true);
      } catch (e) {
        T.failed.push(local + ': ' + e.message);
        el.className = 'error';
        draw('FAILED: ' + e.message, true);
        if (!device || !device.gatt.connected) throw new Error('the Bluetooth connection was lost');
      }
    }
  } catch (e) {
    fatal = e;
    log('Upload stopped: ' + e.message + '\n', 'error');
  } finally {
    swallowPrompts = false;
  }

  const allOk = !fatal && T.failed.length === 0 && T.skipped.length === 0;
  const L = [allOk ? 'Summary: SUCCESS' : (T.ok ? 'Summary: PARTIAL' : 'Summary: FAILED')];
  L.push('  To:      ' + dir);
  L.push('  Files:   ' + T.ok + ' of ' + files.length + ' sent, ' + fmt(T.bytes) + ' of ' + fmt(totalBytes) + ' bytes, ' + secs(performance.now() - t0));
  if (T.skipped.length) L.push('  Skipped: ' + T.skipped.join(', ') + ' (spaces in the name)');
  for (const f of T.failed) L.push('  Failed:  ' + f);
  log(L.join('\n') + '\n', allOk ? 'ok' : 'error');
}

async function runUpload(text) {
  const filesPromise = pickFiles();   // open the picker right away, while the key press still counts
  const args = parseArgs(text).slice(1);
  const files = await filesPromise;
  if (!files.length) { log('No file chosen.\n', 'sys'); return; }
  const target = args[0] || '';
  // several files, or a target that ends with "/": the target is a directory on the device
  if (files.length > 1 || target.endsWith('/')) return runUploadMany(files, target);

  const file = files[0];
  let local = args[0] || '/' + file.name;
  if (!local.startsWith('/')) local = '/' + local;
  if (/\s/.test(local)) {
    log('Device file names cannot contain spaces. Use: upload /name.ext\n', 'error');
    return;
  }

  const s = { fromPcloud: false, step: 'send', source: file.name, local, size: file.size, sent: 0, sendMs: 0, retries: 0 };
  swallowPrompts = true;
  try {
    const data = new Uint8Array(await file.arrayBuffer());
    await sendToDevice(local, data, s);
    printSendSummary(true, s);
  } catch (e) {
    printSendSummary(false, s, e);
  } finally {
    swallowPrompts = false;
  }
}

// pcloud put <file> [folderid]  |  pcloud get <remote> [device file]  |  pcloud <file> [folderid]
async function runPcloud(text) {
  const args = parseArgs(text).slice(1);
  if (args[0] === 'settoken') return runSetToken();
  if (args[0] === 'get') return runPcloudGet(args.slice(1));
  if (args[0] === 'put') return runPcloudPut(args.slice(1));
  return runPcloudPut(args);
}

function onDisconnected() {
  const gone = new Error('disconnected');
  gone.fatal = true;
  finishPending(gone);
  writeChunk = 20;
  log('\nDisconnected.\n', 'sys');
  lastDisconnectAt = Date.now();
  credCache = null;
  setConnected(false);
  rxChar = txChar = null;
}

// Everything after the device has been chosen. The first write ("time ...") is the first access to a
// protected characteristic, so on a phone that is where the pairing dialog / notification appears.
async function openSession() {
  const server  = await device.gatt.connect();
  const service = await server.getPrimaryService(NUS_SERVICE);
  rxChar = await service.getCharacteristic(NUS_RX);
  txChar = await service.getCharacteristic(NUS_TX);

  txChar.addEventListener('characteristicvaluechanged', onData);
  await txChar.startNotifications();

  log('Connected to ' + (device.name || 'an unnamed device') + '\n', 'sys');
  setConnected(true);
  // Sync the ESP32 clock: Unix seconds plus this computer's UTC offset in minutes
  const epoch = Math.floor(Date.now() / 1000);
  const offsetMin = -new Date().getTimezoneOffset();
  log('Syncing time...\n', 'sys');
  await write('time ' + epoch + ' ' + offsetMin + '\n');
  log('Tip: "pcloud put <file>" uploads a device file to pCloud, "upload" copies one or more files from this computer to the device.\n', 'sys');
}

// Try to open a session several times. Android's Bluetooth stack sometimes fails a connection
// attempt for no good reason ("Connection attempt failed"); an immediate retry usually works.
async function connectWithRetries(maxTries) {
  let lastErr = null;
  for (let attempt = 1; attempt <= maxTries; attempt++) {
    try {
      await openSession();
      return;
    } catch (e) {
      lastErr = e;
      // A plain "connection attempt failed" is a one-off: retry quickly. Anything else may be pairing in
      // progress (on Android, look for the passkey request in the notification area): wait longer.
      const quick = /connection attempt failed/i.test(e.message);
      log('Attempt ' + attempt + ' of ' + maxTries + ' failed (' + e.name + ': ' + e.message + ').\n', 'error');
      try { if (device.gatt.connected) device.gatt.disconnect(); } catch (ignored) {}
      if (attempt < maxTries) {
        const waitMs = quick ? 1500 : 5000;
        if (!quick) log('If your phone asks for a passkey, enter it now.\n', 'sys');
        log('Retrying in ' + (waitMs / 1000) + ' s...\n', 'sys');
        await sleep(waitMs);
      }
    }
  }
  throw lastErr;
}

async function connect(showAll = false) {
  if (!navigator.bluetooth) {
    log('Web Bluetooth is not available. Use Chrome or Edge on desktop or Android.\n', 'error');
    return;
  }
  try {
    // On Android, reconnect to the device chosen a moment ago without scanning again (fewer Android scan
    // problems). After two minutes, on other systems, or with "All devices", the device dialog is shown.
    const isAndroid = /Android/i.test(navigator.userAgent);
    const canReuse = isAndroid && device && !device.gatt.connected && !showAll && lastDisconnectAt &&
                     (Date.now() - lastDisconnectAt < 120000);

    if (!canReuse) {
      // The device dialog may only be opened straight from the click, so do it before anything that waits.
      log('Choose your ESP32-S3 in the Bluetooth dialog...\n', 'sys');
      // Normal mode only lists devices whose advertised name starts with "ESP32".
      // "All devices" lists every BLE device, which helps when a board does not show up.
      device = await navigator.bluetooth.requestDevice(showAll
        ? { acceptAllDevices: true, optionalServices: [NUS_SERVICE] }
        : { filters: [{ namePrefix: 'ESP32' }], optionalServices: [NUS_SERVICE] });
      device.addEventListener('gattserverdisconnected', onDisconnected);
    }

    // Give Android a moment after the last session ended; reconnecting instantly fails more often.
    const sinceLast = Date.now() - lastDisconnectAt;
    if (isAndroid && sinceLast < 2000) await sleep(2000 - sinceLast);

    if (canReuse) {
      log('Reconnecting to ' + (device.name || 'the last device') + '...\n', 'sys');
      try {
        await connectWithRetries(3);
      } catch (e) {
        // A new device dialog needs a fresh click (the browser rejects it after waiting), so ask for one.
        device = null;
        log('Reconnect failed. Click Connect again and choose the device from the list.\n', 'error');
      }
      return;
    }
    await connectWithRetries(4);
  } catch (e) {
    log('Connection failed: ' + e.name + ': ' + e.message + '\n', 'error');
    if (/No Services matching/i.test(e.message)) {
      log('That device is not running the terminal service (Nordic UART). Is the right firmware on it?\n', 'sys');
    }
    log('First time? Finish pairing in the system dialog (enter the passkey set in the firmware), then click Connect again.\n', 'sys');
  }
}

function disconnect() {
  if (device && device.gatt.connected) device.gatt.disconnect();
}

// Close the BLE link when the page is reloaded or closed. Chrome on Android can leave it open, which
// keeps the ESP32 busy and makes the next connection fail.
function closeLink() {
  try { if (device && device.gatt.connected) device.gatt.disconnect(); } catch (e) {}
}
window.addEventListener('pagehide', closeLink);
window.addEventListener('beforeunload', closeLink);

let writeChunk = 20;   // raised to MTU-3 once the device reports its MTU (see negotiateWriteSize)
async function writeBytes(bytes) {
  // Stay within the ATT payload; writes with response so the OS can start pairing when needed
  for (let i = 0; i < bytes.length; i += writeChunk) {
    await rxChar.writeValueWithResponse(bytes.slice(i, i + writeChunk));
  }
}
function write(text) {
  return writeBytes(encoder.encode(text));
}

$('connectAll').addEventListener('click', () => { if (!(device && device.gatt.connected)) connect(true); });
connectBtn.addEventListener('click', () => {
  device && device.gatt.connected ? disconnect() : connect();
});
$('clear').addEventListener('click', () => { out.textContent = ''; });

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = cmd.value;
  if (!text.trim() || !rxChar) return;
  history.push(text);
  histPos = history.length;
  log(text + '\n', 'sent');
  cmd.value = '';
  if (/^pcloud(\s|$)/.test(text.trim())) { await runPcloud(text); return; }
  if (/^upload(\s|$)/.test(text.trim())) { await runUpload(text); return; }
  if (pending) { log('A transfer is in progress, please wait.\n', 'error'); return; }
  try { await write(text + '\n'); }
  catch (err) { log('Send failed: ' + err.message + '\n', 'error'); }
});

// Command history: arrow up / down on a keyboard, or the two buttons next to Send on touch screens
function historyStep(dir) {
  if (dir < 0 && histPos > 0) {
    cmd.value = history[--histPos];
  } else if (dir > 0) {
    histPos = Math.min(histPos + 1, history.length);
    cmd.value = history[histPos] || '';
  }
  cmd.setSelectionRange(cmd.value.length, cmd.value.length);
}
cmd.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp')        { historyStep(-1); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { historyStep(+1); e.preventDefault(); }
});
for (const [id, dir] of [['histUp', -1], ['histDown', +1]]) {
  const b = $(id);
  b.addEventListener('pointerdown', e => e.preventDefault());   // keep the focus (and the keyboard) in the input
  b.addEventListener('click', () => { historyStep(dir); cmd.focus(); });
}

if (!navigator.bluetooth) {
  log('This browser does not support Web Bluetooth. Use Chrome or Edge on desktop or Android.\n', 'error');
}
</script>
</body>
</html>
